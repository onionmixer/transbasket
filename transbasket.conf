# ============================================================
# transbasket 기본 설정 "템플릿"
#
# 이 파일은 저장소에 추적되므로 실제 엔드포인트/API 키/내부 호스트를 적지 말 것.
# 실제 운영 값은 같은 디렉터리의 transbasket.local.conf 에 둔다(.gitignore 대상).
#   - 인자 없이 ./transbasket 을 실행하면 transbasket.local.conf 가 있으면 그것을,
#     없으면 이 파일을 읽는다.
#   - 명시 지정: ./transbasket -c <path>  또는  TRANSBASKET_CONFIG=<path>
# 처음 설정하려면:  cp transbasket.conf transbasket.local.conf  후 값 수정
# ============================================================
# ============================================================
# MODEL_TYPE: 번역 백엔드 선택
#   normal : OpenAI 호환 HTTP API 로 번역 (OPENAI_BASE_URL/MODEL/API_KEY 사용)
#            - 기존 기본 동작. /v1/chat/completions 엔드포인트 호출.
#   codex  : 시스템에 설치된 codex CLI 로 번역 (요청마다 `codex exec`).
#            - OPENAI_* 설정은 사용하지 않음. 호스트에 codex 로그인 필요.
#            - 아래 CODEX_* 설정이 적용됨.
# ============================================================
MODEL_TYPE="normal"

# --- MODEL_TYPE="codex" 일 때만 사용되는 설정 ---
# CODEX_INTERFACE: codex CLI 호출 방식. "exec" (요청마다 `codex exec`) 하나뿐이다.
#   레거시 "mcp" (`codex mcp-server`) 는 2026-11-06 제거됨: codex 모드에서 "mcp" 면 기동하지 않는다.
#CODEX_INTERFACE="exec"
# CODEX_BIN: codex 실행 파일 경로 (기본 "codex", PATH 검색)
#CODEX_BIN="codex"
# CODEX_MODEL: codex 가 사용할 모델 오버라이드 (미설정 시 codex 기본 모델)
#   주의: 빈 값("")은 codex 기본 모델로 처리됨. 특정 모델을 쓰려면 값을 지정.
#CODEX_MODEL="gpt-5.2"
# CODEX_SANDBOX: 샌드박스 모드. 번역 엔드포인트는 read-only 로 강제됨(아래 UNSAFE 참고).
#CODEX_SANDBOX="read-only"
# CODEX_APPROVAL_POLICY: 명령 승인 정책. 번역 용도는 never 로 강제됨.
#CODEX_APPROVAL_POLICY="never"
# CODEX_ALLOW_UNSAFE: true 일 때만 위 두 값에 위험 설정(workspace-write 등)을 허용(개발/특수용). 기본 false.
#CODEX_ALLOW_UNSAFE="false"
# CODEX_TIMEOUT: codex 응답 대기 타임아웃(초, 기본 100). MHD 연결 타임아웃(120초) 때문에 120 이상이면 110 으로 줄이고,
#   잘못된 값·0 이하는 100.
#CODEX_TIMEOUT="100"
# CODEX_MAX_CONCURRENCY: 동시에 띄울 codex 프로세스 최대 수 (자원 보호용, 기본 = MAX_WORKERS)
#CODEX_MAX_CONCURRENCY="8"
# CODEX_REASONING_EFFORT: model_reasoning_effort 오버라이드(선택). 미설정 시 codex 설정을 따름.
#   허용값은 모델마다 다르다(예: none 을 거부하는 모델이 있음).
#CODEX_REASONING_EFFORT="none"
# CODEX_IGNORE_USER_CONFIG: true 면 $CODEX_HOME/config.toml 을 읽지 않는다(exec 전용, 인증은 유지).
#   config.toml 의 MCP 서버/플러그인은 매 번역마다 기동되고, 그 도구는 read-only 샌드박스
#   밖이라 번역 원문(신뢰 불가)이 호출을 유도할 수 있다. 번역 전용 계정이 아니라면 true 권장.
#   true 이면 config.toml 의 model 도 무시되므로 CODEX_MODEL 을 함께 지정할 것.
#CODEX_IGNORE_USER_CONFIG="false"
# CODEX_RUN_DIR: 요청별 임시 작업 디렉터리(cwd)를 만들 루트. 서비스 유저 쓰기가능 + 0700 권장.
#CODEX_RUN_DIR="/var/lib/transbasket/run"
# (중요) codex 모드에서는 TRANS_CACHE_THRESHOLD="1" 로 둘 것. codex 출력은 비결정적이어서
#        동일 원문이라도 대개 표현이 달라져 캐시 count 가 1 로 리셋되므로, 2 이상이면
#        임계값에 사실상 도달하지 못해 캐시가 무효화되고 매 요청마다 codex 를 호출하게 된다.

# --- MODEL_TYPE="normal" 일 때 사용되는 설정 (OpenAI 호환 HTTP API) ---
OPENAI_BASE_URL="http://<ollama-host>:11434/v1"
# OPENAI_MODEL="gpt-oss:20b"
OPENAI_MODEL="translategemma:27b"
OPENAI_API_KEY="."
# LISTEN: 바인드할 숫자 주소. 0.0.0.0=모든 IPv4, 127.0.0.1=로컬만, ::=IPv4+IPv6, ::1=IPv6 로컬.
#   호스트 이름이나 잘못된 값, 읽히지 않는 LISTEN 줄은 기동 오류 (README "LISTEN - 바인드 주소").
LISTEN="0.0.0.0"
PORT="8889"
DEBUG=no
TEMPERATURE=0.2
TOP_P=0.95
#frequency_penalty = 0 이상이면 재등장 억제
FREQUENCY_PENALTY=0
#presence_penalty = 0.2-0.6 이면 새로운 주제로 이동
PRESENCE_PENALTY=0
SEED=42
STREAM=no
# normal 번역문의 이스케이프 (\n \t \r \\ \" \') 를 한 번 더 해제할지 (기본 yes = 예전과 같음).
# no 면 번역문 속 백슬래시가 그대로 남음. 바꿔도 이미 캐시된 번역은 그대로 (README "normal 백엔드 후처리")
#NORMAL_UNESCAPE=yes
# Reasoning effort: none, low, medium, high
REASONING_EFFORT=none

# Translation cache settings
# Cache backend type: text, sqlite, mongodb, redis
# - text: JSONL file-based cache (default, lightweight)
# - sqlite: SQLite database (better performance for large datasets)
# - mongodb: MongoDB (distributed, high availability) - Not yet implemented
# - redis: Redis (in-memory, fastest) - Not yet implemented
TRANS_CACHE_TYPE="sqlite"

# Text backend settings (when TRANS_CACHE_TYPE=text)
TRANS_CACHE_FILE="./trans_dictionary.txt"

# SQLite backend settings (when TRANS_CACHE_TYPE=sqlite)
TRANS_CACHE_SQLITE_PATH="./trans_cache.db"
# TRANS_CACHE_SQLITE_JOURNAL_MODE: DELETE TRUNCATE PERSIST MEMORY WAL OFF (default WAL)
# TRANS_CACHE_SQLITE_SYNC: OFF NORMAL FULL EXTRA (default NORMAL). The startup log shows what is
# in effect; MEMORY / OFF and synchronous OFF can corrupt the cache on a crash.
TRANS_CACHE_SQLITE_JOURNAL_MODE="WAL"
TRANS_CACHE_SQLITE_SYNC="NORMAL"

# Common cache settings (applies to all backends)
TRANS_CACHE_THRESHOLD="5"
TRANS_CACHE_CLEANUP_ENABLED="true"
TRANS_CACHE_CLEANUP_DAYS="60"

# Same-key requests share one translation; cache eligibility still uses the threshold.
# All retries, codex slot waits and I/O share this total budget (1..110 seconds).
TRANSLATION_TOTAL_TIMEOUT="110"
# unset = MAX_WORKERS, default 30
#INFLIGHT_MAX_KEYS="30"
# followers across all keys (owners excluded)
INFLIGHT_MAX_WAITERS="256"
INFLIGHT_MAX_WAITERS_PER_KEY="64"

# open HTTP connections at once, 1..1020 (unset = libmicrohttpd's default, 1020);
# over the limit new connections wait in the listen backlog (README "동시성")
#HTTP_MAX_CONNECTIONS="200"

# Prompt and language configuration
# PROMPT_PREFIX_FILE: Path to prompt prefix file
# Available templates:
#   - PROMPT_PREFIX.txt (default, uses <source> tags)
#   - PROMPT_PREFIX_translategemma.txt (TranslateGemma format)
# PROMPT_PREFIX_FILE="PROMPT_PREFIX.txt"
PROMPT_PREFIX_FILE="PROMPT_PREFIX_translategemma.txt"

# Optional source=auto override (unset = built-in automatic detection prompt).
# Relative to this config file. Target tokens and optional {TEXT} are supported;
# {SOURCE_LANG}/{SOURCE_CODE} are invalid because auto bypasses source lookup.
#PROMPT_PREFIX_AUTO_FILE="PROMPT_PREFIX_auto.txt"

# SOURCE_HINT_MODE: from=auto 번역의 원문 기준언어(source_hint) 기록 방식. 캐시 키와 HTTP 응답은 그대로다.
#   off    : 기록하지 않음
#   script : 서버가 문자 체계로 판정 (기본). Latin 문자만 있으면 und
#   model  : codex exec 가 번역과 함께 원문 언어를 보고 (MODEL_TYPE=codex, CODEX_INTERFACE=exec 전용,
#            검증 실패나 문자 증거와의 모순이면 script 값으로 대체)
#SOURCE_HINT_MODE="script"

# LANGUAGE_TABLE_FILE: Path to language table configuration
LANGUAGE_TABLE_FILE="language_tables.conf"
