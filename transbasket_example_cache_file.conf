# Transbasket Configuration Example - File (JSONL) Cache Backend
# Copy this file to transbasket.conf and modify as needed

# OpenAI-compatible API settings
OPENAI_BASE_URL="http://localhost:11434/v1"
OPENAI_MODEL="your-model-name"
OPENAI_API_KEY="your-api-key"

# Server settings
LISTEN="0.0.0.0"
PORT="8889"
DEBUG=no

# Model parameters
TEMPERATURE=0.2
TOP_P=0.95
FREQUENCY_PENALTY=0
PRESENCE_PENALTY=0
SEED=42
STREAM=no

# Reasoning effort: none, low, medium, high
REASONING_EFFORT=none

# ============================================
# Translation Cache Settings - File Backend
# ============================================
# JSONL file-based cache is lightweight and human-readable
# Good for small to medium datasets

TRANS_CACHE_TYPE="text"

# JSONL cache file path
TRANS_CACHE_FILE="./trans_dictionary.txt"

# Common cache settings
# Minimum hit count before using cached translation
TRANS_CACHE_THRESHOLD="5"

# Automatic cleanup of old entries
TRANS_CACHE_CLEANUP_ENABLED="true"
TRANS_CACHE_CLEANUP_DAYS="60"

# ============================================
# Prompt and Language Configuration
# ============================================

# Prompt template file
# Available templates:
#   - PROMPT_PREFIX.txt (default, uses <source> tags)
#   - PROMPT_PREFIX_translategemma.txt (TranslateGemma format)
PROMPT_PREFIX_FILE="PROMPT_PREFIX.txt"

# Language table configuration file
LANGUAGE_TABLE_FILE="language_tables.conf"
