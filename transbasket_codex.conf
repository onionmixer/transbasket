# ============================================================
# transbasket - codex (MCP) backend configuration
# transbasket.conf 의 사본. MODEL_TYPE 을 codex 로 설정하고
# CODEX_* 설정을 활성화한 버전입니다.
#
# 실행: ./run_codex.sh   (또는 ./transbasket -c transbasket_codex.conf)
# 전제: 시스템에 codex CLI 설치 + `codex login` 완료 + 쓰기가능 CODEX_HOME
# ============================================================

# ------------------------------------------------------------
# MODEL_TYPE: 번역 백엔드 선택
#   normal : OpenAI 호환 HTTP API 로 번역 (OPENAI_BASE_URL/MODEL/API_KEY 사용)
#   codex  : codex CLI 를 MCP 서버(codex mcp-server)로 구동하여 번역
# ------------------------------------------------------------
MODEL_TYPE="codex"

# --- codex (MCP) 전용 설정 ---
# CODEX_BIN: codex 실행 파일 경로 (기본 "codex", PATH 검색)
CODEX_BIN="codex"
# CODEX_MODEL: codex 가 사용할 모델 오버라이드 (미설정 시 codex 기본 모델)
#   특정 모델을 강제하려면 주석을 풀고 값을 지정.
#CODEX_MODEL="gpt-5.2"
# CODEX_SANDBOX: 샌드박스 모드. 번역 엔드포인트는 read-only 로 강제됨.
CODEX_SANDBOX="read-only"
# CODEX_APPROVAL_POLICY: 명령 승인 정책. 번역 용도는 never 로 강제됨.
CODEX_APPROVAL_POLICY="never"
# CODEX_ALLOW_UNSAFE: true 일 때만 위 두 값에 위험 설정 허용(개발/특수용). 기본 false.
#CODEX_ALLOW_UNSAFE="false"
# CODEX_TIMEOUT: codex 응답 대기 타임아웃(초). MHD 연결 타임아웃(120초)보다 작아야 함.
CODEX_TIMEOUT="100"
# CODEX_MAX_CONCURRENCY: 동시에 띄울 codex 프로세스 최대 수.
#   codex 는 호출당 비용/자원이 크므로 MAX_WORKERS(기본 30)보다 작게 두는 것을 권장.
CODEX_MAX_CONCURRENCY="4"
# CODEX_REASONING_EFFORT: arguments.config 로 주입할 추론 강도(선택). 미설정 시 주입 안 함.
CODEX_REASONING_EFFORT="none"
# CODEX_RUN_DIR: 요청별 임시 작업 디렉터리(cwd)를 만들 루트.
#   서비스 유저 쓰기가능 필요. 운영 배포 시 /var/lib/transbasket/run 권장.
#   (run_codex.sh 가 이 디렉터리를 자동 생성/0700 설정)
CODEX_RUN_DIR="./codex_run"

# --- MODEL_TYPE="codex" 에서는 아래 OPENAI_* 설정은 무시됩니다 (참고용으로 유지) ---
OPENAI_BASE_URL="http://192.168.1.239:11434/v1"
OPENAI_MODEL="translategemma:27b"
OPENAI_API_KEY="."
LISTEN="0.0.0.0"
PORT="8889"
DEBUG=yes
TEMPERATURE=0.2
TOP_P=0.95
#frequency_penalty = 0 이상이면 재등장 억제
FREQUENCY_PENALTY=0
#presence_penalty = 0.2-0.6 이면 새로운 주제로 이동
PRESENCE_PENALTY=0
SEED=42
STREAM=no
# Reasoning effort: none, low, medium, high (normal 백엔드용; codex 는 CODEX_REASONING_EFFORT 사용)
REASONING_EFFORT=none

# Translation cache settings
# Cache backend type: text, sqlite, mongodb, redis
TRANS_CACHE_TYPE="sqlite"

# Text backend settings (when TRANS_CACHE_TYPE=text)
TRANS_CACHE_FILE="./trans_dictionary.txt"

# SQLite backend settings (when TRANS_CACHE_TYPE=sqlite)
# codex 결과가 normal 결과와 섞이지 않도록 별도 캐시 DB 를 사용합니다.
TRANS_CACHE_SQLITE_PATH="./trans_cache_codex.db"
TRANS_CACHE_SQLITE_JOURNAL_MODE="WAL"
TRANS_CACHE_SQLITE_SYNC="NORMAL"

# Common cache settings (applies to all backends)
# codex 는 호출 비용이 크므로 반복 텍스트를 즉시 캐싱하도록 임계값 1 권장.
TRANS_CACHE_THRESHOLD="1"
TRANS_CACHE_CLEANUP_ENABLED="true"
TRANS_CACHE_CLEANUP_DAYS="60"

# Prompt and language configuration
# PROMPT_PREFIX_FILE="PROMPT_PREFIX.txt"
PROMPT_PREFIX_FILE="PROMPT_PREFIX_translategemma.txt"

# LANGUAGE_TABLE_FILE: Path to language table configuration
LANGUAGE_TABLE_FILE="language_tables.conf"
