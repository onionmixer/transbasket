# ============================================================
# transbasket - codex backend configuration
# transbasket.conf 의 사본. MODEL_TYPE 을 codex 로 설정하고
# CODEX_* 설정을 활성화한 버전입니다.
#
# 실행: ./transbasket -c transbasket_codex.conf
#       (또는 이 파일을 환경별로 복사해 전용 run 스크립트로 구동)
#
# 이 파일은 저장소에 추적되는 "템플릿"이다. 실제 엔드포인트/API 키/내부 호스트는
# 적지 말고, 복사본(transbasket_codex.local.conf 등 *.local.conf)에 두어라.
# *.local.conf 는 .gitignore 대상이다.
# 전제: 시스템에 codex CLI 설치 + `codex login` 완료 + 쓰기가능 CODEX_HOME
# ============================================================

# ------------------------------------------------------------
# MODEL_TYPE: 번역 백엔드 선택
#   normal : OpenAI 호환 HTTP API 로 번역 (OPENAI_BASE_URL/MODEL/API_KEY 사용)
#   codex  : codex CLI 로 번역 (요청마다 `codex exec`)
# ------------------------------------------------------------
MODEL_TYPE="codex"

# --- codex 전용 설정 ---
# CODEX_INTERFACE: "exec" (요청마다 `codex exec`) 하나뿐이다. 레거시 "mcp" 는 2026-11-06 제거되어
#   "mcp" 로 두면 기동하지 않는다.
CODEX_INTERFACE="exec"
# CODEX_BIN: codex 실행 파일 경로 (기본 "codex", PATH 검색)
CODEX_BIN="codex"
# CODEX_MODEL: codex 가 사용할 모델 오버라이드 (미설정 시 codex 기본 모델)
#   특정 모델을 강제하려면 주석을 풀고 값을 지정.
#CODEX_MODEL="gpt-5.2"
# CODEX_SANDBOX: 샌드박스 모드. 번역 엔드포인트는 read-only 로 강제됨.
CODEX_SANDBOX="read-only"
# CODEX_APPROVAL_POLICY: 명령 승인 정책. 번역 용도는 never 로 강제됨.
CODEX_APPROVAL_POLICY="never"
# CODEX_ALLOW_UNSAFE: true 일 때만 위 두 값에 위험 설정 허용(개발/특수용). 기본 false.
#CODEX_ALLOW_UNSAFE="false"
# CODEX_TIMEOUT: codex 응답 대기 타임아웃(초, 기본 100). MHD 연결 타임아웃(120초) 때문에 120 이상이면 110 으로 줄이고,
#   잘못된 값·0 이하는 100.
CODEX_TIMEOUT="100"
# CODEX_MAX_CONCURRENCY: 동시에 띄울 codex 프로세스 최대 수.
#   codex 는 호출당 비용/자원이 크므로 MAX_WORKERS(기본 30)보다 작게 두는 것을 권장.
CODEX_MAX_CONCURRENCY="4"
# CODEX_REASONING_EFFORT: model_reasoning_effort 오버라이드(선택). 미설정 시 codex 설정을 따름.
#   허용값은 모델마다 다르다(예: none 을 거부하는 모델이 있음).
CODEX_REASONING_EFFORT="none"
# CODEX_IGNORE_USER_CONFIG: true 면 $CODEX_HOME/config.toml 을 읽지 않는다(인증은 유지).
#   config.toml 에 MCP 서버/플러그인이 있으면 매 번역마다 함께 기동되고, 그 도구는 read-only
#   샌드박스 밖이라 번역 원문이 호출을 유도할 수 있다(기동 로그에 경고가 찍힌다).
#   true 로 둘 때는 config.toml 의 model 도 무시되므로 CODEX_MODEL 을 반드시 지정할 것
#   (codex 내장 기본 모델은 CODEX_REASONING_EFFORT="none" 을 거부할 수 있다).
#CODEX_IGNORE_USER_CONFIG="true"
# CODEX_RUN_DIR: 요청별 임시 작업 디렉터리(cwd)를 만들 루트.
#   서비스 유저 쓰기가능 필요. 운영 배포 시 /var/lib/transbasket/run 권장.
#   (전용 run 스크립트가 이 디렉터리를 자동 생성/0700 설정하거나, 직접 mkdir -p)
CODEX_RUN_DIR="./codex_run"

# --- MODEL_TYPE="codex" 에서는 아래 OPENAI_* 설정은 무시됩니다 (참고용으로 유지) ---
OPENAI_BASE_URL="http://<ollama-host>:11434/v1"
OPENAI_MODEL="translategemma:27b"
OPENAI_API_KEY="."
# LISTEN: 바인드할 숫자 주소. 0.0.0.0=모든 IPv4, 127.0.0.1=로컬만, ::=IPv4+IPv6, ::1=IPv6 로컬.
#   호스트 이름이나 잘못된 값, 읽히지 않는 LISTEN 줄은 기동 오류 (README "LISTEN - 바인드 주소").
LISTEN="0.0.0.0"
PORT="8889"
DEBUG=no
TEMPERATURE=0.2
TOP_P=0.95
#frequency_penalty = 0 이상이면 재등장 억제
FREQUENCY_PENALTY=0
#presence_penalty = 0.2-0.6 이면 새로운 주제로 이동
PRESENCE_PENALTY=0
SEED=42
STREAM=no
# Reasoning effort: none, low, medium, high (normal 백엔드용; codex 는 CODEX_REASONING_EFFORT 사용)
REASONING_EFFORT=none

# Translation cache settings
# Cache backend type: text, sqlite (mongodb, redis: not implemented, fall back to text with a warning)
TRANS_CACHE_TYPE="sqlite"

# Text backend settings (when TRANS_CACHE_TYPE=text)
TRANS_CACHE_FILE="./trans_dictionary.txt"

# SQLite backend settings (when TRANS_CACHE_TYPE=sqlite)
# codex 결과가 normal 결과와 섞이지 않도록 별도 캐시 DB 를 사용합니다.
TRANS_CACHE_SQLITE_PATH="./trans_cache_codex.db"
# TRANS_CACHE_SQLITE_JOURNAL_MODE: DELETE TRUNCATE PERSIST MEMORY WAL OFF (default WAL)
# TRANS_CACHE_SQLITE_SYNC: OFF NORMAL FULL EXTRA (default NORMAL). The startup log shows what is
# in effect; MEMORY / OFF and synchronous OFF can corrupt the cache on a crash.
TRANS_CACHE_SQLITE_JOURNAL_MODE="WAL"
TRANS_CACHE_SQLITE_SYNC="NORMAL"

# Common cache settings (applies to all backends)
# codex 모드에서는 1 로 둘 것 (강제되지는 않음, 로더 기본값은 5).
#   codex 출력은 비결정적이라 같은 원문도 대개 표현이 조금씩 달라지고, 그때마다
#   캐시 엔트리의 count 가 1 로 리셋된다. 따라서 임계값이 2 이상이면 그 값에 사실상
#   도달하지 못해 캐시가 무효화되고 매 요청이 codex 를 호출한다(비용/지연 증가).
TRANS_CACHE_THRESHOLD="1"
TRANS_CACHE_CLEANUP_ENABLED="true"
TRANS_CACHE_CLEANUP_DAYS="60"

# Duplicate requests wait for the same result; they do not raise the cache count.
# 1..110s, includes the slot wait and the codex exec run
TRANSLATION_TOTAL_TIMEOUT="110"
# unset = MAX_WORKERS
#INFLIGHT_MAX_KEYS="30"
INFLIGHT_MAX_WAITERS="256"
INFLIGHT_MAX_WAITERS_PER_KEY="64"

# Prompt and language configuration
# PROMPT_PREFIX_FILE="PROMPT_PREFIX.txt"
PROMPT_PREFIX_FILE="PROMPT_PREFIX_translategemma.txt"

# source=auto uses its own built-in instruction, bypassing source language lookup.
# Optional override: target tokens and optional {TEXT}, no source tokens.
#PROMPT_PREFIX_AUTO_FILE="PROMPT_PREFIX_auto.txt"

# SOURCE_HINT_MODE: from=auto 번역의 원문 기준언어(source_hint) 기록 방식. 캐시 키와 HTTP 응답은 그대로다.
#   off    : 기록하지 않음
#   script : 서버가 문자 체계로 판정 (기본). Latin 문자만 있으면 und
#   model  : codex exec 가 번역과 함께 원문 언어를 보고 (MODEL_TYPE=codex, CODEX_INTERFACE=exec 전용,
#            검증 실패나 문자 증거와의 모순이면 script 값으로 대체)
#SOURCE_HINT_MODE="script"

# LANGUAGE_TABLE_FILE: Path to language table configuration
LANGUAGE_TABLE_FILE="language_tables.conf"
